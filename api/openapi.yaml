        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
  parameters:
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ErrorResponse:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OkResponse:
      description: Operation completed
      content:
        application/json:
          schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
    UserResponse:
      description: Authenticated user
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: '#/components/schemas/User' }
    ContentResponse:
      description: Content record
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties:
              item: { $ref: '#/components/schemas/Content' }
              eventId: { type: [string, 'null'], format: uuid }
    ContentListResponse:
      description: Content records
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Content' } }
    PublicContentListResponse:
      description: Published public content
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/PublicContent' } }
    ResourceResponse:
      description: Teaching resource record
      content:
        application/json:
          schema:
            type: object
            required: [item]
            properties:
              item: { $ref: '#/components/schemas/TeachingResource' }
    ResourceListResponse:
      description: Teaching resources
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/TeachingResource' } }
  schemas:
    GenericJSON:
      type: object
      description: Database-backed JSON object whose selected fields depend on the record type.
      additionalProperties: true
    GenericJSONList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GenericJSON' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 500 }
        offset: { type: integer, minimum: 0 }
    RoleAssignmentRequest:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
    RolePermissionsRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    ComplianceAssetPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        reviewStatus: { type: string, enum: [pending, in_review, approved, approved_with_conditions, replace_or_remove, blocked] }
        riskLevel: { type: string, enum: [low, medium, high, critical, unknown] }
        ownershipBasis: { type: string, enum: [original, commissioned, licensed, open_license, public_domain, user_submitted, third_party_permission, unknown] }
        permissionStatus: { type: string, enum: [confirmed, conditional, unknown, not_permitted, not_applicable] }
        useScope: { type: string, enum: [commercial_web, internal_only, redistribution, modification, multiple, unknown] }
        distributionStatus: { type: string, enum: [served_publicly, bundled_in_frontend, server_side_only, internal_only, not_distributed, unknown] }
        sourceUrl: { type: string, maxLength: 2048 }
        rightsholder: { type: string, maxLength: 500 }
        licenseId: { anyOf: [{ type: string, format: uuid }, { type: string, enum: [''] }, { type: 'null' }] }
        notes: { type: string, maxLength: 10000 }
        active: { type: boolean }
    ComplianceEvidenceWrite:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, enum: [license_text, source_page, purchase_receipt, permission_email, contract, author_declaration, screenshot, hash_record, repository_metadata, legal_review, other] }
        uri: { type: string, maxLength: 2048 }
        text: { type: string, maxLength: 50000 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        notes: { type: string, maxLength: 5000 }
    ComplianceEvidenceVerification:
      type: object
      required: [verified]
      additionalProperties: false
      properties:
        verified: { type: boolean }
    ComplianceReviewWrite:
      type: object
      description: Review types match the current database constraint; legacy copyright reviews are stored as license reviews.
      required: [type, decision, riskLevel]
      additionalProperties: false
      properties:
        type: { type: string, enum: [license, privacy, content, distribution, legal_basis, recheck] }
        decision: { type: string, enum: [approved, approved_with_conditions, pending_evidence, replace, remove, blocked, escalate] }
        riskLevel: { type: string, enum: [low, medium, high, critical, unknown] }
        findings: { type: string, maxLength: 10000 }
        requiredActions:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 2000 }
        followUpAt: { type: [string, 'null'], format: date-time }
    ComplianceLicensePatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        reviewStatus: { type: string, enum: [unreviewed, reviewed, restricted, needs_counsel] }
        notes: { type: string, maxLength: 10000 }
        family: { type: string, enum: [permissive, copyleft, weak_copyleft, proprietary, public_domain, custom, other] }
        commercialUseAllowed: { type: boolean }
        modificationAllowed: { type: boolean }
        redistributionAllowed: { type: boolean }
        attributionRequired: { type: boolean }
        sourceCodeOfferRequired: { type: boolean }
    ComplianceLegalDocumentPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        bodyMarkdown: { type: string, maxLength: 250000 }
        status: { type: string, enum: [draft, in_review, published, archived] }
        missingInformation:
          type: array
          items: { type: string, maxLength: 1000 }
        factualAssumptions:
          type: array
          items: { type: string, maxLength: 1000 }
        approvedBy: { type: string, maxLength: 200 }
        legalReviewAt: { type: [string, 'null'], format: date-time }
        effectiveAt: { type: [string, 'null'], format: date-time }
        legalBasis:
          type: array
          items:
            type: object
            additionalProperties: { type: string }
        changeNote: { type: string, maxLength: 5000 }
    ComplianceReviewerPatch:
      type: object
      required: [isCopyrightReviewer]
      additionalProperties: false
      properties:
        isCopyrightReviewer: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        errors: { type: array, items: { type: string } }
    Health:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ok] } }
    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        displayName: { type: string, maxLength: 60 }
        password: { type: string, minLength: 10, maxLength: 72 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 72 }
    Content:
      type: object
      required: [id, title, slug, contentType, tags, summary, body, visibility, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        authorId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 100 }
        contentType: { type: string, enum: [article, tool, resource, project] }
        tags: { type: array, items: { type: string } }
        parentCategory: { anyOf: [{ $ref: '#/components/schemas/ParentCategory' }, { type: 'null' }] }
        childCategory: { anyOf: [{ $ref: '#/components/schemas/ChildCategory' }, { type: 'null' }] }
        summary: { type: string, maxLength: 500 }
        body: { type: string, maxLength: 100000 }
        visibility: { type: string, enum: [public, private] }
        status: { type: string, enum: [draft, published, unpublished] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        publishedAt: { type: [string, 'null'], format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
        likeCount: { type: integer }
        favoriteCount: { type: integer }
        viewerLiked: { type: boolean }
        viewerFavorited: { type: boolean }
        authorName: { type: string }
        authorJoinedAt: { type: string, format: date-time }
    PublicContent:
      type: object
      required: [id, title, slug, contentType, tags, parentCategory, childCategory, summary, publishedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        contentType: { type: string, enum: [article, tool, resource, project] }
        tags: { type: array, items: { type: string } }
        parentCategory: { anyOf: [{ $ref: '#/components/schemas/ParentCategory' }, { type: 'null' }] }
        childCategory: { anyOf: [{ $ref: '#/components/schemas/ChildCategory' }, { type: 'null' }] }
        summary: { type: string }
        publishedAt: { type: [string, 'null'], format: date-time }
    ParentCategory:
      type: string
      enum: [教育, 年级, 教育人力资源, 旅游, 网络, 系统, 编程, 软件工具]
    ChildCategory:
      type: string
