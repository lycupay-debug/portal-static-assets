openapi: 3.1.0
info:
  title: Personal Portal API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: >-
    Shared API contract for the Personal Portal. The Go API is the only business
    backend. C IPC acknowledgements represent notification delivery only; the
    PostgreSQL event state determines durable processing outcomes.
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Account registration, login, and cookie-based sessions.
  - name: Content
    description: Authenticated content authoring, history, publishing, and recycle bin.
  - name: Public content
    description: Published articles and user interactions.
  - name: Teaching resources
    description: Authenticated teaching resource metadata, files, and recycle bin.
  - name: Administration
    description: Super-administrator-only account, role, and permission management.
  - name: Compliance
    description: Permission-gated asset, license, legal document, audit, and reviewer management.
  - name: Platform
    description: Health, layout policy, and internal event intake.
  - name: System operations
    description: Administrator-only system warnings, log history, and resumable live log streams.
paths:
  /healthz:
    get:
      tags: [Platform]
      security: []
      summary: Check Go API process health
      operationId: healthCheck
      responses:
        '200':
          description: Go API process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /layout-policy:
    get:
      tags: [Platform]
      security: []
      summary: Get responsive layout policy
      operationId: getLayoutPolicy
      parameters:
        - { in: query, name: width, schema: { type: integer, minimum: 240, maximum: 10000 } }
        - { in: query, name: height, schema: { type: integer, minimum: 240, maximum: 10000 } }
      responses:
        '200':
          description: Shared responsive layout tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutPolicy' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /readyz:
    get:
      tags: [Platform]
      summary: Check database and C event core readiness (internal only)
      operationId: readinessCheck
      security: []
      x-internal: true
      responses:
        '200':
          description: Database and C event core are ready
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string, enum: [ready] } } }
        '503': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /dbz:
    get:
      tags: [Platform]
      summary: Check PostgreSQL connectivity (internal only)
      operationId: databaseHealthCheck
      security: []
      x-internal: true
      responses:
        '200':
          description: Database is reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /metrics:
    get:
      tags: [Platform]
      summary: Export database-derived event metrics (internal only)
      operationId: getEventMetrics
      security: []
      x-internal: true
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
        '503': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register an account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Create an authenticated session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current session user
      operationId: getCurrentUser
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      operationId: logout
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        '405': { $ref: '#/components/responses/ErrorResponse' }
  /uploads:
    post:
      tags: [Content]
      summary: Upload an editor image
      operationId: uploadImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mime, data]
              properties:
                mime: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp, image/avif] }
                data: { type: string, contentEncoding: base64 }
      responses:
        '201':
          description: Image uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url, mime, size]
                properties:
                  url: { type: string }
                  mime: { type: string }
                  size: { type: integer }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /system-ops/logs:
    get:
      tags: [System operations]
      summary: Read a bounded log tail or records after a byte cursor
      operationId: listSystemLogs
      parameters:
        - { in: query, name: source, required: true, schema: { type: string, enum: [server, ssh] } }
        - { in: query, name: after, schema: { type: integer, minimum: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Bounded log records and continuation cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemLogPage' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /system-ops/warnings:
    get:
      tags: [System operations]
      summary: List recent system warnings and failed cleanup events
      operationId: listSystemWarnings
      responses:
        '200':
          description: Recent recognizable warning records
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemWarnings' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /system-ops/stream:
    get:
      tags: [System operations]
      summary: Subscribe to appended log records with Server-Sent Events
      operationId: streamSystemLogs
      description: Administrator-only SSE stream. Reconnect with Last-Event-ID to resume from the byte cursor.
      parameters:
        - { in: query, name: source, required: true, schema: { type: string, enum: [server, ssh] } }
        - { in: query, name: after, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: A stream of log events
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /content:
    get:
      tags: [Content]
      summary: List the current user’s content
      operationId: listContent
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [draft, published, unpublished] }
      responses:
        '200': { $ref: '#/components/responses/ContentListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Content]
      summary: Create a content record
      operationId: createContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentWrite' }
      responses:
        '201': { $ref: '#/components/responses/ContentResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /content/trash:
    get:
      tags: [Content]
      summary: List content in the recycle bin
      operationId: listContentTrash
      responses:
        '200': { $ref: '#/components/responses/ContentListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [Content]
      summary: Get an owned content record
      operationId: getContent
      responses:
        '200': { $ref: '#/components/responses/ContentResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    patch:
      tags: [Content]
      summary: Update an owned content record
      operationId: updateContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentPatch' }
      responses:
        '200':
          description: Content updated
          content:
            application/json:
              schema:
                type: object
                required: [item, versionCreated]
                properties:
                  item: { $ref: '#/components/schemas/Content' }
                  versionCreated: { type: boolean }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Content]
      summary: Move content to the recycle bin
      operationId: moveContentToTrash
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}/publish:
    post:
      tags: [Content]
      summary: Publish a content record and enqueue validation
      operationId: publishContent
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200': { $ref: '#/components/responses/ContentResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}/unpublish:
    post:
      tags: [Content]
      summary: Unpublish a content record
      operationId: unpublishContent
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200': { $ref: '#/components/responses/ContentResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}/restore:
    post:
      tags: [Content]
      summary: Restore content from the recycle bin
      operationId: restoreContentFromTrash
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200': { $ref: '#/components/responses/ContentResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}/permanent:
    delete:
      tags: [Content]
      summary: Permanently delete content from the recycle bin
      operationId: permanentlyDeleteContent
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}/versions:
    get:
      tags: [Content]
      summary: List content version history
      operationId: listContentVersions
      parameters:
        - $ref: '#/components/parameters/ContentId'
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentVersion' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /content/{contentId}/versions/{versionId}/restore:
    post:
      tags: [Content]
      summary: Restore a historical content version
      operationId: restoreContentVersion
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Historical content restored
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/Content' }
                  eventId: { type: [string, 'null'], format: uuid }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /public/content:
    get:
      tags: [Public content]
      security: []
      summary: List published public content
      operationId: listPublicContent
      responses:
        '200': { $ref: '#/components/responses/PublicContentListResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /public/content/{slug}:
    get:
      tags: [Public content]
      security: []
      summary: Get a published public content record
      operationId: getPublicContent
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
      responses:
        '200': { $ref: '#/components/responses/ContentResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /public/content/{slug}/interactions:
    post:
      tags: [Public content]
      summary: Toggle a like or favorite
      operationId: toggleContentInteraction
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [like, favorite] }
      responses:
        '200':
          description: Interaction toggled
          content:
            application/json:
              schema:
                type: object
                required: [active, likeCount, favoriteCount]
                properties:
                  active: { type: boolean }
                  likeCount: { type: integer }
                  favoriteCount: { type: integer }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /public/resources:
    get:
      tags: [Public content]
      security: []
      summary: List explicitly published teaching resources
      operationId: listPublicTeachingResources
      responses:
        '200':
          description: Public teaching resource list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PublicTeachingResource' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /public/resources/{id}/download:
    get:
      tags: [Public content]
      security: []
      summary: Download a file attached to a published teaching resource
      operationId: downloadPublicTeachingResource
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Public resource file }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /public/resources/{id}/preview:
    get:
      tags: [Public content]
      security: []
      summary: Stream an MP3 attached to a published teaching resource with byte-range support
      operationId: previewPublicTeachingResourceMP3
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Range, required: false, schema: { type: string }, description: Optional byte range used by native audio seeking }
      responses:
        '200': { description: MP3 media stream, headers: { Accept-Ranges: { schema: { type: string } }, Content-Type: { schema: { type: string, example: audio/mpeg } } } }
        '206': { description: Partial MP3 media stream for byte-range requests }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /resources:
    get:
      tags: [Teaching resources]
      summary: List teaching resources
      operationId: listTeachingResources
      responses:
        '200': { $ref: '#/components/responses/ResourceListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Teaching resources]
      summary: Create a teaching resource
      operationId: createTeachingResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceWrite' }
      responses:
        '201': { $ref: '#/components/responses/ResourceResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '413': { $ref: '#/components/responses/ErrorResponse' }
  /resources/trash:
    get:
      tags: [Teaching resources]
      summary: List teaching resources in the recycle bin
      operationId: listTeachingResourceTrash
      responses:
        '200': { $ref: '#/components/responses/ResourceListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /resources/{resourceId}:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Teaching resources]
      summary: Update teaching resource metadata or file
      operationId: updateTeachingResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceWrite' }
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
    delete:
      tags: [Teaching resources]
      summary: Move a teaching resource to the recycle bin
      operationId: moveTeachingResourceToTrash
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /resources/{resourceId}/restore:
    post:
      tags: [Teaching resources]
      summary: Restore a teaching resource
      operationId: restoreTeachingResource
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200': { $ref: '#/components/responses/ResourceResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /resources/{resourceId}/permanent:
    delete:
      tags: [Teaching resources]
      summary: Permanently delete a teaching resource
      operationId: permanentlyDeleteTeachingResource
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200': { $ref: '#/components/responses/OkResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /resources/{resourceId}/download:
    get:
      tags: [Teaching resources]
      summary: Download a teaching resource file
      operationId: downloadTeachingResource
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Original teaching resource file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /resources/{resourceId}/preview:
    get:
      tags: [Teaching resources]
      summary: Stream an owned MP3 teaching resource with byte-range support
      operationId: previewTeachingResourceMP3
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - { in: header, name: Range, required: false, schema: { type: string }, description: Optional byte range used by native audio seeking }
      responses:
        '200': { description: MP3 media stream }
        '206': { description: Partial MP3 media stream for byte-range requests }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /events:
    post:
      tags: [Platform]
      security: []
      x-internal: true
      description: Internal event intake. Public Caddy routing intentionally denies this path; use the loopback Go API or a future authenticated ingress.
      summary: Durably receive an internal business event
      operationId: receiveEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '202':
          description: Event durably accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReceipt' }
        '200':
          description: Idempotent duplicate receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventReceipt' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /public/legal:
    get:
      tags: [Public content]
      security: []
      summary: List published legal and policy documents
      operationId: listPublishedLegalDocuments
      responses:
        '200':
          description: Published legal documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericJSONList' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '500': { $ref: '#/components/responses/ErrorResponse' }
  /public/legal/{slug}:
    get:
      tags: [Public content]
      security: []
      summary: Read one published legal document
      operationId: getPublishedLegalDocument
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
      responses:
        '200':
          description: Published legal document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericJSON' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '500': { $ref: '#/components/responses/ErrorResponse' }
  /uploads/{filename}:
    servers:
      - url: /
    get:
      tags: [Public content]
      security:
        - {}
        - sessionCookie: []
      summary: Read an uploaded image when public-reference or owner access rules permit
      description: The route is served at the site root rather than under /api. Public content may reference an image; otherwise the uploader or administrator session is required by the handler. Anonymous access is permitted only for publicly referenced images.
      operationId: getUploadedImage
      parameters:
        - { in: path, name: filename, required: true, schema: { type: string, pattern: '^[0-9a-f-]{36}\.(png|jpe?g|gif|webp|avif)$' } }
      responses:
        '200':
          description: Validated uploaded image
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /admin/users:
    get:
      tags: [Administration]
      summary: List portal accounts and assigned roles
      description: Requires the designated super-administrator identity and super_admin role.
      operationId: listAdminUsers
      responses:
        '200':
          description: Account and role assignments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericJSONList' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /admin/roles:
    get:
      tags: [Administration]
      summary: List roles and their permission keys
      description: Requires the designated super-administrator identity and super_admin role.
      operationId: listAdminRoles
      responses:
        '200':
          description: Role definitions and permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericJSONList' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /admin/permissions:
    get:
      tags: [Administration]
      summary: List permission definitions
      description: Requires the designated super-administrator identity and super_admin role.
      operationId: listAdminPermissions
      responses:
        '200':
          description: Permission definitions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericJSONList' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /admin/users/{userId}/roles:
    patch:
      tags: [Administration]
      summary: Replace a user's assigned roles
      description: Requires the designated super-administrator identity. The designated super_admin account cannot lose its super_admin role, and no other account can receive it.
      operationId: replaceAdminUserRoles
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleAssignmentRequest' }
      responses:
        '200':
          description: Updated role assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenericJSON' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
