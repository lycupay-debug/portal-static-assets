name: CI

on:
  push:
    branches: [main, "integration/**", "refactor/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend behavior tests
        working-directory: frontend
        run: npm test
      - name: API contract lint
        working-directory: frontend
        run: npm run api:lint
      - name: Verify generated API contract
        working-directory: frontend
        run: npm run api:check
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Production build and bundle budget
        working-directory: frontend
        run: npm run build
      - name: Validate emitted static assets
        working-directory: frontend
        run: npm run check:static-assets
      - name: Package static asset release candidate
        working-directory: frontend
        run: npm run package:static-assets
      - name: Build for independent static origin
        working-directory: frontend
        run: npm run build:static-origin
      - name: Package independent static origin release candidate
        working-directory: frontend
        run: npm run package:static-origin
      - name: Upload static asset release candidates
        uses: actions/upload-artifact@v4
        with:
          name: portal-static-assets-${{ github.sha }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Go backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify dependencies
        working-directory: backend
        run: go mod verify
      - name: Static checks
        working-directory: backend
        run: go vet ./...

  event-core:
    name: C event core checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile event core
        working-directory: event-core
        run: make clean all

  compliance-and-deploy-policy:
    name: Compliance and deployment policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax checks
        run: python -m compileall -q scripts/compliance
      - name: Shell syntax checks
        run: |
          find deploy/freebsd scripts/ops -type f \( -name '*.sh' -o -name 'deploy.sh' -o -name 'rollback.sh' \) -print0 | xargs -0 -n1 sh -n
      - name: Patch whitespace check
        run: git diff --check
